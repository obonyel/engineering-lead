[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sahara-mzansi-backend"
version = "0.2.0"
description = "Sahara Mzansi Experience, Process, and System Layers (FastAPI + CrewAI Flows + Gemini + Tavily + Supabase Ledger)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "google-genai>=2.30.1",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
agents = [
    "crewai>=0.102.0",
    "copilotkit>=0.1.39",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
